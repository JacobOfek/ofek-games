main{position:relative;flex:1;min-height:0}

 --coral:#FF5C8A;--sand:#FFC857;--turq:#3EF0D0;--sky:#5AA8FF;--olive:#A98BFF;--rose:#FF6FD8;--steel:#5A6480;--ember:#FF8A3D;--danger:#FF4B4B;--plum:#B06BFF}

.mtable tr.off td{opacity:.45}
.misbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.3}

.mnote{font-size:13px!important;margin:0 0 14px!important}
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;max-width:min(92%,420px);width:max-content;text-align:center;
 background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 18px;box-shadow:0 8px 28px rgba(0,0,0,.3);pointer-events:none;animation:tpop .35s cubic-bezier(.2,1.4,.4,1)}

<script>/* Fit the page to the part of the screen that is really visible.
   Chrome on iPad: when claude.ai opens this page in a new tab from another artifact (the links board), it sizes the
   frame as if Chrome had no toolbars, so the bottom ~130px fall off the screen and nothing inside the frame can see
   that (innerHeight and visualViewport report the oversized frame). Rotating the iPad fixes it, so we cap the height
   at what fits under Chrome's toolbars + the claude.ai header (172px, measured on iPad Chrome). A faint ↕ button next to the
   mute button (Chrome on iPad only) trims more, after a confirmation, if this estimate is ever off; the choice is remembered. */
(()=>{const ua=navigator.userAgent,iosChrome=/CriOS/.test(ua)&&(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)),framed=window.top!==window,UI=172,STEPS=[0,40,80,130,180];
 let extra=0;try{extra=+localStorage.getItem('fitExtra')||0}catch(e){}
 let h0=0;
 const target=()=>{const vv=window.visualViewport;let h=Math.round(vv?Math.min(vv.height,innerHeight):innerHeight);
  if(iosChrome&&framed){const land=innerWidth>innerHeight,sh=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
   if(h>sh-UI+8)h=sh-UI;h-=extra;}
  return h;};
 const f=window.__fitScreen=()=>{const h=target();if(h>0&&h!==h0){h0=h;document.documentElement.style.height=h+'px';dispatchEvent(new Event('resize'));}if(scrollY||scrollX)scrollTo(0,0);};
 f();addEventListener('resize',f);addEventListener('orientationchange',()=>setTimeout(f,300));if(window.visualViewport)visualViewport.addEventListener('resize',f);setInterval(f,700);
 if(iosChrome&&framed)addEventListener('DOMContentLoaded',()=>{
  const mute=document.getElementById('muteBtn'),b=document.createElement('button');b.type='button';b.textContent='↕';b.title='התאמת גובה המסך';b.setAttribute('aria-label','התאמת גובה המסך');
  if(mute){b.className=mute.className;b.style.cssText='opacity:.3;font-size:15px';mute.insertAdjacentElement('afterend',b);}
  else{b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:4px;z-index:9999;width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:inherit;font:14px/1 system-ui;opacity:.3;padding:0';document.body.appendChild(b);}
  const save=v=>{extra=v;try{localStorage.setItem('fitExtra',String(v))}catch(_){}h0=0;f();};
  b.onclick=e=>{e.stopPropagation();b.blur();
   const ov=document.createElement('div');ov.dir='rtl';
   ov.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;font:15px/1.5 system-ui,-apple-system,sans-serif';
   const next=STEPS[Math.min(STEPS.indexOf(extra)+1,STEPS.length-1)];
   ov.innerHTML='<div style="background:#1f2126;color:#eee;border-radius:14px;max-width:360px;width:100%;padding:18px;text-align:right;box-shadow:0 10px 30px rgba(0,0,0,.4)">'+
    '<b style="font-size:17px;display:block;margin-bottom:6px">התאמת גובה המסך</b>'+
    '<p style="margin:0 0 14px;color:#bbb">השתמשו בזה רק אם תחתית המשחק חתוכה. ״הקטן״ מנמיך את המשחק בעוד קצת, וההגדרה נשמרת לפעם הבאה.'+(extra?' כרגע המשחק מוקטן ב-'+extra+' פיקסלים.':'')+'</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    (extra<STEPS[STEPS.length-1]?'<button data-a="more" style="flex:1;border:0;border-radius:999px;padding:10px 14px;background:#7FA6FF;color:#111;font:inherit">הקטן ב-'+(next-extra)+' פיקסלים</button>':'')+
    (extra?'<button data-a="reset" style="flex:1;border:1px solid #555;border-radius:999px;padding:10px 14px;background:transparent;color:#eee;font:inherit">אפס</button>':'')+
    '<button data-a="no" style="flex:1;border:1px solid #555;border-radius:999px;padding:10px 14px;background:transparent;color:#eee;font:inherit">ביטול</button></div></div>';
   ov.addEventListener('click',ev=>{ev.stopPropagation();const a=ev.target.closest('[data-a]')?.dataset.a;if(!a&&ev.target!==ov)return;
    if(a==='more')save(next);else if(a==='reset')save(0);ov.remove();});
   ['pointerdown','touchstart','touchmove','keydown'].forEach(t=>ov.addEventListener(t,ev=>ev.stopPropagation(),{passive:true}));
   document.body.appendChild(ov);};
 });
})();</script>
<script>
(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
/* ---------- storage: browser storage + a private copy in the user's claude.ai account ----------
   Browser storage alone can be wiped (Safari clears site data after ~7 days without a visit,
   privacy settings, cleared history). So every value is also mirrored to the viewer's own
   private cloud document, and on load the two are merged — the higher score always wins. */
const mem={};const cloud={db:null,ref:null,t:0,busy:false,dirty:false,ready:false};
const BEST_KEYS=['breakout-best','breakout2-best'],LAST_KEYS=['breakout-last','breakout2-last'];
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
const store={
 get(k,d){const v=lsGet(k);if(v!==null)return v;return k in mem?mem[k]:d;},
 set(k,v){v=String(v);if(BEST_KEYS.includes(k)&&(+v||0)<(+store.get(k,0)||0))return;mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}cloudPush();},
 del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}cloudPush();}
};
function allLocal(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('breakout'))o[k]=localStorage.getItem(k);}}catch(e){}return Object.assign({},mem,o);}
function cloudPush(now){if(!cloud.ref)return;cloud.dirty=true;clearTimeout(cloud.t);cloud.t=setTimeout(cloudWrite,now?0:3000);}
async function cloudWrite(){if(!cloud.ref||!cloud.dirty)return;if(cloud.busy){cloudPush();return;}cloud.busy=true;cloud.dirty=false;
 try{await cloud.ref.set({kv:allLocal(),at:Date.now()});}catch(e){if(e&&e.code==='invalid_argument'||e&&e.code==='not_granted')cloud.ref=null;else cloud.dirty=true;}
 cloud.busy=false;}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}
async function cloudInit(){
 if(await cfInit())return;
 try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
  const uid=await user.id();if(!uid)return;const ref=db.doc('data/users/'+uid+'/breakout');
  const snap=await ref.get();const kv=(snap.exists&&snap.data()&&snap.data().kv)||{};
  for(const [k,v] of Object.entries(kv)){if(typeof v!=='string'||!k.startsWith('breakout'))continue;const cur=lsGet(k);
   if(BEST_KEYS.includes(k)||LAST_KEYS.includes(k)){if((+v||0)>(+store.get(k,0)||0)){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}}
   else if(cur===null){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}}

   Login and personal codes come from /ofek.js (window.OFEK). Local progress belongs to one player
   at a time ("breakout-owner"); when another player logs in on this device, the page starts from
   that player's own saved progress. */
const CF={on:false,pending:[]};
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
try{CF.pending=JSON.parse(lsGet('ofek-pending')||'[]')}catch(e){CF.pending=[]}
const KEEP=['breakout-mode','breakout-diff','breakout-padh','breakout-muted','breakout-missions'];
function clearLocalProgress(){try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
 if(k&&k.startsWith('breakout')&&!KEEP.includes(k))ks.push(k);}ks.forEach(k=>localStorage.removeItem(k));}catch(e){}
 for(const k in mem)if(!KEEP.includes(k))delete mem[k];}
function mergeKv(kv){for(const [k,v] of Object.entries(kv||{})){if(typeof v!=='string'||!k.startsWith('breakout'))continue;const cur=lsGet(k);
 if(BEST_KEYS.includes(k)||LAST_KEYS.includes(k)){if((+v||0)>(+store.get(k,0)||0)){mem[k]=v;lsSet(k,v);}}

function layout(){

 if(ow){const sx=W/ow;P.x*=sx;S.balls.forEach(b=>{b.x*=sx;b.y=Math.min(b.y,H)});S.drops.forEach(d=>d.x*=sx);}else P.x=W/2;

function brickLayout(){const n=S.cols,pad=Math.max(10,W*.04),gap=Math.max(3,W*(n>8?.009:.012)),bw=(W-pad*2-gap*(n-1))/n;Object.assign(L,{pad,gap,bw,bh:Math.min(bw*(n>8?.62:.55),H*.042)});}

 ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(r.x+5,r.y+2.5,r.w-10,1.5);
 if(br.x){const cx=r.x+r.w/2,cy=r.y+r.h/2,k=Math.min(r.w,r.h)*.3*(1+.15*Math.sin(t/120));ctx.fillStyle='#FFE08A';ctx.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,rad=i%2?k*.45:k;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}ctx.closePath();ctx.fill();}
 else if(br.hp>1){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;rr(r.x+4,r.y+4,r.w-8,r.h-8,3);ctx.stroke();}
}
function drawShip(t){
 const x=P.x-P.w/2,y=P.y,w=P.w,h=P.h;
 const fl=4+3*Math.sin(t/40);ctx.fillStyle=C.ember;[.22,.78].forEach(u=>{ctx.beginPath();ctx.moveTo(x+w*u-4,y+h);ctx.lineTo(x+w*u+4,y+h);ctx.lineTo(x+w*u,y+h+fl+4);ctx.closePath();ctx.fill();});

 ctx.fillStyle='rgba(90,200,255,.85)';ctx.beginPath();ctx.ellipse(P.x,y+1,w*.12,h*.75,0,Math.PI,0);ctx.fill();
 [[.06,C.coral],[.94,C.turq]].forEach(([u,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+w*u,y+h/2,Math.max(2,h*.18),0,Math.PI*2);ctx.fill();});
 if(S.glueT>0){ctx.fillStyle=C.olive;ctx.globalAlpha=.85;rr(x+h*.4,y-3,w-h*.8,4,2);ctx.fill();ctx.globalAlpha=1;}
}
function draw(){
 const t=performance.now();
 if(MODE===2)drawSpace(t);else{ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);}
 for(const br of S.bricks){const r=brickRect(br);if(MODE===2){drawBrick2(br,r,t);continue;}
  if(br.solid){rr(r.x,r.y,r.w,r.h,3);ctx.fillStyle=C.steel;ctx.fill();ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(r.x+2,r.y+2,r.w-4,2);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(r.x+2,r.y+r.h-3,r.w-4,2);
   ctx.fillStyle='rgba(0,0,0,.35)';const bs=Math.max(1.5,r.h*.09);[[.18,.3],[.82,.3],[.18,.7],[.82,.7]].forEach(([u,v])=>{ctx.beginPath();ctx.arc(r.x+r.w*u,r.y+r.h*v,bs,0,Math.PI*2);ctx.fill();});continue;}
  rr(r.x,r.y,r.w,r.h,4);ctx.fillStyle=C[br.col];ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(r.x+3,r.y+2,r.w-6,2);
  const s=Math.min(r.w,r.h)*.26;diamond(r.x+r.w/2,r.y+r.h/2,s);
  if(br.hp>1){ctx.fillStyle='#0B2E47';ctx.fill();rr(r.x+2.5,r.y+2.5,r.w-5,r.h-5,3);ctx.strokeStyle='#0B2E47';ctx.lineWidth=1.5;ctx.stroke();}
  else{ctx.fillStyle='rgba(11,46,71,.22)';ctx.fill();}
 }
 for(const p of S.parts){ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.s,p.s);}ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const d of S.drops){const o=DROPS[d.type];rr(d.x-17,d.y-10,34,20,10);ctx.fillStyle=C[o.c];ctx.fill();ctx.fillStyle=o.ink||'#0B2E47';ctx.font='700 13px Rubik, system-ui, sans-serif';ctx.direction='ltr';ctx.fillText(o.t,d.x,d.y+1);ctx.direction='inherit';}
 if(MODE===2)drawShip(t);else{rr(P.x-P.w/2,P.y,P.w,P.h,P.h/2);ctx.fillStyle=S.slowT>0?C.sky:C.sand;ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(P.x-P.w/2+P.h/2,P.y+2,P.w-P.h,2);
 if(S.glueT>0){ctx.fillStyle=C.olive;rr(P.x-P.w/2+P.h/2,P.y-3,P.w-P.h,4,2);ctx.fill();}}
 if(S.shield>0){ctx.save();ctx.globalAlpha=.55+.25*Math.sin(performance.now()/250);ctx.fillStyle=C.turq;ctx.fillRect(0,H-4,W,3);ctx.restore();}
 if(S.gunT>0){ctx.fillStyle=C.rose;const off=P.w/2-P.h*.6;[-off,off].forEach(o=>{rr(P.x+o-3,P.y-7,6,9,2);ctx.fill();});}
 ctx.fillStyle=C.rose;for(const s of S.shots){rr(s.x-1.8,s.y,3.6,10,1.8);ctx.fill();}
 const act=TIMED.filter(([k])=>S[k]>0);
 if(act.length){ctx.font='700 15px Rubik, system-ui, sans-serif';ctx.textBaseline='middle';const gapX=30,y0=Math.min(H-9,P.y+P.h+13),x0=Math.max(gapX*act.length/2,Math.min(W-gapX*act.length/2,P.x))-(act.length-1)*gapX/2;
  act.forEach(([k,c],i)=>{ctx.fillStyle=C[c];ctx.fillText(String(Math.ceil(S[k])),x0+i*gapX,y0);});}
 for(const f of S.fires){const r=Math.max(6,L.r*.9),g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r*2.2);g.addColorStop(0,'#FFF3C4');g.addColorStop(.35,'#FFB03B');g.addColorStop(.7,'rgba(255,80,40,.6)');g.addColorStop(1,'rgba(255,40,20,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r*2.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,120,40,.35)';ctx.beginPath();ctx.arc(f.x-f.dx*r*2,f.y-f.dy*r*2,r*1.2,0,Math.PI*2);ctx.fill();}
 if(S.pierceT>0){ctx.save();ctx.shadowColor=C.turq;ctx.shadowBlur=16;
  for(const b of S.balls){const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,L.r*1.5);g.addColorStop(0,'#FFFFFF');g.addColorStop(.5,C.turq);g.addColorStop(1,'rgba(47,184,172,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,L.r*1.5,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,L.r*.75,0,Math.PI*2);ctx.fill();}
  ctx.restore();}
 else if(MODE===2){ctx.save();ctx.shadowColor='#8FE3FF';ctx.shadowBlur=14;ctx.fillStyle='#F2FBFF';for(const b of S.balls){ctx.beginPath();ctx.arc(b.x,b.y,L.r,0,Math.PI*2);ctx.fill();}ctx.restore();}
 else{ctx.fillStyle=C.ink;for(const b of S.balls){ctx.beginPath();ctx.arc(b.x,b.y,L.r,0,Math.PI*2);ctx.fill();}}
 if(S.state==='play'&&S.balls.some(b=>b.stuck)){ctx.fillStyle=C.muted;ctx.font='600 15px Rubik, system-ui, sans-serif';ctx.fillText(usingMouse?'לחץ כדי לשחרר את הכדור':'הקש כדי לשחרר את הכדור',W/2,Math.min(H*.62,P.y-60));}
 if(S.state==='ready'){ctx.fillStyle=C.muted;ctx.font='600 16px Rubik, system-ui, sans-serif';ctx.fillText(usingMouse?'לחץ כדי לשגר · הזז את העכבר':'הקש כדי לשגר · גרור להזזה',W/2,Math.min(H*.62,P.y-60));}
}

/* ---------- input ---------- */
let drag=null;
let usingMouse=matchMedia('(hover: hover) and (pointer: fine)').matches;
function mouseX(e){return e.clientX-cv.getBoundingClientRect().left;}
// Mouse: paddle follows the cursor with no button held; click launches
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;usingMouse=true;if(S.state==='play'||S.state==='ready'){P.x=mouseX(e);clampPaddle();}});
cv.addEventListener('pointerdown',e=>{unlockAudio();if(e.pointerType==='mouse'){usingMouse=true;P.x=mouseX(e);clampPaddle();if(S.state==='ready')launch();else if(S.state==='play')releaseGlued();e.preventDefault();return;}usingMouse=false;cv.setPointerCapture(e.pointerId);const x=e.clientX-cv.getBoundingClientRect().left;drag={id:e.pointerId,off:P.x-x,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:0};e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const x=e.clientX-cv.getBoundingClientRect().left;P.x=x+drag.off;clampPaddle();drag.moved=Math.max(drag.moved,Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy));});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;if(drag.moved<12&&performance.now()-drag.t<400){if(S.state==='ready')launch();else if(S.state==='play')releaseGlued();}drag=null;}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',()=>drag=null);

const keys={};
addEventListener('keydown',e=>{keys[e.key]=true;
 if(e.key===' '){unlockAudio();if(S.state==='ready')launch();else if(S.state==='play')releaseGlued();e.preventDefault();}
 if(e.code==='KeyP'||e.key==='p'||e.key==='P'||e.key==='Escape'){unlockAudio();S.state==='paused'?resumeGame():pause();e.preventDefault();}});
addEventListener('keyup',e=>keys[e.key]=false);

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(1/30,(now-last)/1000);last=now;fitCheck();
 const kv=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);if(kv){P.x+=kv*W*1.3*dt;clampPaddle();}
 update(dt);updateMisBar();if(misPend.length&&(S.state==='play'||S.state==='ready'||S.state==='clear'))misFlush();if(S.state==='play'||S.state==='ready')saveProgress();draw();cv.classList.toggle('nocursor',usingMouse&&(S.state==='play'||S.state==='ready'));requestAnimationFrame(frame);}
function fitCheck(){const r=cv.getBoundingClientRect();if(Math.abs(r.width-W)>.5||Math.abs(r.height-H)>.5)layout();}
addEventListener('resize',fitCheck);addEventListener('orientationchange',fitCheck);
if(window.ResizeObserver)new ResizeObserver(fitCheck).observe(cv);
if(window.visualViewport){visualViewport.addEventListener('resize',fitCheck);visualViewport.addEventListener('scroll',fitCheck);}
layout();loadLevel(1);resetBall();S.state='menu';hud();
function showHome(){
 const lastTxt=lastLevel>1?`במשחק האחרון הגעת לשלב ${lastLevel}. `:'';
 if(MODE===1)showOverlay({title:tiles(['שובר','אריחים']),text:lastTxt+`${PATTERNS.length} שלבים. גררו את המחבט עם האצבע, או הזיזו את העכבר במחשב, ושברו את כל האריחים. אריחים עם מסגרת כהה צריכים שתי פגיעות, ואריחי הפלדה האפורים לא נשברים בכלל.`,btn:'התחל משחק',fn:()=>newGame(1),settings:true,resume:true});
 else showOverlay({title:tiles(['שובר','הלבנים','2']),text:lastTxt+`${PATTERNS.length} שלבים בחלל. לבנים כתומות מתפוצצות ויורות כדור אש לכיוון אקראי, ואם הוא פוגע בחללית שלך זו פסילה. בונוס הדבק מצמיד את הכדור לחללית, והקשה משחררת אותו. אסטרואידים אפורים לא נשברים.`,btn:'המראה!',fn:()=>newGame(1),settings:true,resume:true});
}
function switchMode(m){
 MODE=m;store.set('breakout-mode',String(m));document.documentElement.dataset.game=String(m);document.title=m===2?'שובר הלבנים 2':'שובר אריחים';readColors();
 PATTERNS=m===2?P2:P1;S.best=+store.get(K('best'),0)||0;lastLevel=+store.get(K('last'),1)||1;saved=readSaved();

}

 const ll=+store.get(K('last'),1)||1;if(S.state==='menu'||S.state==='over')lastLevel=Math.max(lastLevel,ll);

if(MODE===2)document.title='שובר הלבנים 2';
async function saveBeforeHome(){
 if(S.state==='play'||S.state==='ready')pause();          // pause() also stores the game for "continue from save"

/* ---------- home button: save, sync, then back to the games home page ---------- */
let goingHome=false;
const flushWithin=(p,ms)=>Promise.race([Promise.resolve(p).catch(()=>{}),new Promise(r=>setTimeout(r,ms))]);

})();
