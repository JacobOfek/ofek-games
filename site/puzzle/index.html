<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>פאזל מהתמונות שלך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECE9F2;--well:#DAD5E6;--ink:#231F33;--muted:#5E5873;--accent:#5B4BDB;--accentInk:#FFFFFF;--line:rgba(35,31,51,.16);--glass:rgba(236,233,242,.94)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1B29;--well:#2B2739;--ink:#ECE9F2;--muted:#A7A0BD;--accent:#9D90FF;--accentInk:#1E1B29;--line:rgba(236,233,242,.14);--glass:rgba(30,27,41,.95)}}
:root[data-theme="dark"]{--bg:#1E1B29;--well:#2B2739;--ink:#ECE9F2;--muted:#A7A0BD;--accent:#9D90FF;--accentInk:#1E1B29;--line:rgba(236,233,242,.14);--glass:rgba(30,27,41,.95)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Heebo',system-ui,-apple-system,Arial,sans-serif;display:flex;flex-direction:column;height:100%;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,label.btn{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
header[hidden]{display:none}
header{display:flex;align-items:center;gap:14px;padding:8px 12px;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{font-size:12px;color:var(--muted)}
.stat b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.sp{flex:1}
.tool{border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool svg{flex:none}
@media (max-width:420px){.tool span{display:none}.tool{padding:8px}}
main{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.screen{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:22px 18px 40px}
.screen[hidden]{display:none}
.inner{max-width:520px;margin:0 auto}
h1{font-family:'Suez One',serif;font-weight:400;font-size:40px;line-height:1.1;margin:8px 0 8px}
.lead{color:var(--muted);font-size:17px;line-height:1.55;margin:0 0 20px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:0 0 26px}
.tile{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--well);aspect-ratio:3/2;cursor:pointer}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;inset:auto 0 0 0;padding:14px 8px 5px;font-size:13px;font-weight:700;color:#fff;text-align:right;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.tile span small{display:block;font-weight:400;font-size:11px;opacity:.9}
.tile[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.del{position:absolute;top:5px;left:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:28px;padding:0;cursor:pointer}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.gh small{color:var(--muted);font-size:13px}
.catpick{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:-6px 0 16px}
.catpick[hidden]{display:none}
.catpick select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.note{color:var(--muted);font-size:14px;margin:-4px 0 14px;line-height:1.5}
.preview{display:none;margin:0 0 20px;border-radius:12px;overflow:hidden;background:var(--well);text-align:center}
.preview.on{display:block}
.preview img{display:block;max-width:100%;max-height:32dvh;margin:0 auto}
h2{font-family:'Suez One',serif;font-weight:400;font-size:22px;margin:0 0 10px}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.count{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.count b{font-family:'Suez One',serif;font-weight:400;font-size:24px;line-height:1.1}
.count small{font-size:12px;color:var(--muted)}
.count[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.hint{font-size:14px;color:var(--muted);margin:0 0 22px;min-height:1.4em}
.start{width:100%;justify-content:center;padding:15px;font-size:18px;font-weight:700}
.start:disabled{opacity:.4;cursor:default}
.err{color:#C0392B;font-size:14px;margin:-8px 0 16px}
.done{position:absolute;inset:auto 12px 12px 12px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;max-width:420px;margin:0 auto}
.done[hidden]{display:none}
.done h2{font-size:28px;margin:0 0 4px}
.done p{margin:0 0 12px;color:var(--muted)}
.done .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
</style>

</head>
<body>
<header id="hdr" hidden>
  <div class="stat"><small>על הלוח</small><b id="prog">0/0</b></div>
  <div class="stat"><small>זמן</small><b id="time">0:00</b></div>
  <div class="sp"></div>
  <button class="tool" id="muteBtn"></button>
  <button class="tool" id="peekBtn" aria-pressed="false" aria-label="הצג את התמונה ברקע"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>תמונה</span></button>
  <button class="tool" id="scatterBtn" aria-label="פזר מחדש"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span>פזר</span></button>
  <button class="tool" id="newBtn" aria-label="פאזל חדש"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>חדש</span></button>
</header>
<main>
  <canvas id="cv"></canvas>
  <div class="done" id="done" hidden>
    <h2>הפאזל הושלם!</h2><p id="doneText"></p>
    <div class="row"><button class="btn primary" id="moreBtn">אותה תמונה, יותר חלקים</button><button class="btn" id="againBtn">פאזל חדש</button></div>
  </div>
  <div class="screen" id="setup">
    <div class="inner">
      <h1>פאזל מהתמונות שלך</h1>
      <p class="lead">בחר תמונה מהטלפון או מהמחשב, מהאוסף שלך או מהמקומות בעולם למטה, קבע כמה חלקים, והרכב אותה מחדש.</p>
      <div class="pick">
        <label class="btn primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-5-9 8"/></svg>בחר תמונה<input type="file" id="file" accept="image/*"></label>
      </div>
      <label class="catpick" id="catPick" hidden>שמור תמונות חדשות ב: <select id="catSel"></select></label>
      <p class="note" id="saveNote" hidden></p>
      <p class="err" id="err" hidden></p>
      <div class="preview" id="preview"><img id="previewImg" alt="התמונה שנבחרה"></div>
      <h2>כמה חלקים?</h2>
      <div class="counts" id="counts"></div>
      <p class="hint" id="hint"></p>
      <button class="btn primary start" id="startBtn" disabled>בחר תמונה כדי להתחיל</button>
      <div style="height:30px"></div>
      <p class="note" id="colNote">תמונות שתבחר נשמרות אוטומטית באוסף, ואפשר לחזור אליהן בכל פעם.</p>
      <div id="collections"></div>
      <div class="gh"><h2>מקומות בעולם</h2><small>איורים</small></div>
      <div class="gal" id="placeGal"></div>
    </div>
  </div>
</main>
<script>/* Fit the page to the part of the screen that is really visible.
   Chrome on iPad: when claude.ai opens this page in a new tab from another artifact (the links board), it sizes the
   frame as if Chrome had no toolbars, so the bottom ~130px fall off the screen and nothing inside the frame can see
   that (innerHeight and visualViewport report the oversized frame). Rotating the iPad fixes it, so we cap the height
   at what fits under Chrome's toolbars + the claude.ai header (172px, measured on iPad Chrome). A faint ↕ button next to the
   mute button (Chrome on iPad only) trims more, after a confirmation, if this estimate is ever off; the choice is remembered. */
(()=>{const ua=navigator.userAgent,iosChrome=/CriOS/.test(ua)&&(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)),framed=window.top!==window,UI=172,STEPS=[0,40,80,130,180];
 let extra=0;try{extra=+localStorage.getItem('fitExtra')||0}catch(e){}
 let h0=0;
 const target=()=>{const vv=window.visualViewport;let h=Math.round(vv?Math.min(vv.height,innerHeight):innerHeight);
  if(iosChrome&&framed){const land=innerWidth>innerHeight,sh=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
   if(h>sh-UI+8)h=sh-UI;h-=extra;}
  return h;};
 const f=window.__fitScreen=()=>{const h=target();if(h>0&&h!==h0){h0=h;document.documentElement.style.height=h+'px';dispatchEvent(new Event('resize'));}if(scrollY||scrollX)scrollTo(0,0);};
 f();addEventListener('resize',f);addEventListener('orientationchange',()=>setTimeout(f,300));if(window.visualViewport)visualViewport.addEventListener('resize',f);setInterval(f,700);
 if(iosChrome&&framed)addEventListener('DOMContentLoaded',()=>{
  const mute=document.getElementById('muteBtn'),b=document.createElement('button');b.type='button';b.textContent='↕';b.title='התאמת גובה המסך';b.setAttribute('aria-label','התאמת גובה המסך');
  if(mute){b.className=mute.className;b.style.cssText='opacity:.3;font-size:15px';mute.insertAdjacentElement('afterend',b);}
  else{b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:4px;z-index:9999;width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:inherit;font:14px/1 system-ui;opacity:.3;padding:0';document.body.appendChild(b);}
  const save=v=>{extra=v;try{localStorage.setItem('fitExtra',String(v))}catch(_){}h0=0;f();};
  b.onclick=e=>{e.stopPropagation();b.blur();
   const ov=document.createElement('div');ov.dir='rtl';
   ov.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;font:15px/1.5 system-ui,-apple-system,sans-serif';
   const next=STEPS[Math.min(STEPS.indexOf(extra)+1,STEPS.length-1)];
   ov.innerHTML='<div style="background:#1f2126;color:#eee;border-radius:14px;max-width:360px;width:100%;padding:18px;text-align:right;box-shadow:0 10px 30px rgba(0,0,0,.4)">'+
    '<b style="font-size:17px;display:block;margin-bottom:6px">התאמת גובה המסך</b>'+
    '<p style="margin:0 0 14px;color:#bbb">השתמשו בזה רק אם תחתית המשחק חתוכה. ״הקטן״ מנמיך את המשחק בעוד קצת, וההגדרה נשמרת לפעם הבאה.'+(extra?' כרגע המשחק מוקטן ב-'+extra+' פיקסלים.':'')+'</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    (extra<STEPS[STEPS.length-1]?'<button data-a="more" style="flex:1;border:0;border-radius:999px;padding:10px 14px;background:#7FA6FF;color:#111;font:inherit">הקטן ב-'+(next-extra)+' פיקסלים</button>':'')+
    (extra?'<button data-a="reset" style="flex:1;border:1px solid #555;border-radius:999px;padding:10px 14px;background:transparent;color:#eee;font:inherit">אפס</button>':'')+
    '<button data-a="no" style="flex:1;border:1px solid #555;border-radius:999px;padding:10px 14px;background:transparent;color:#eee;font:inherit">ביטול</button></div></div>';
   ov.addEventListener('click',ev=>{ev.stopPropagation();const a=ev.target.closest('[data-a]')?.dataset.a;if(!a&&ev.target!==ov)return;
    if(a==='more')save(next);else if(a==='reset')save(0);ov.remove();});
   ['pointerdown','touchstart','touchmove','keydown'].forEach(t=>ov.addEventListener(t,ev=>ev.stopPropagation(),{passive:true}));
   document.body.appendChild(ov);};
 });
})();</script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const hit=document.createElement('canvas').getContext('2d');
const OPTIONS=[{n:12,l:'קל מאוד'},{n:24,l:'קל'},{n:48,l:'בינוני'},{n:96,l:'קשה'},{n:150,l:'מאתגר'}];
let src=null,srcAspect=1,chosen=+(()=>{try{return localStorage.getItem('puzzle-count')}catch(e){return null}})()||24;
let P=null; // puzzle state
let W=0,H=0,dpr=1,s=1,ox=0,oy=0,layoutKind='';
let drag=null,peek=false,dirty=true,timer=null;

/* ---------- setup screen ---------- */
function gridFor(n,a){let best=null;for(let c=2;c<=30;c++){const r=Math.max(2,Math.round(n/c)),pa=a*r/c,sc=Math.abs(Math.log(pa))*2+Math.abs(r*c-n)/n;if(!best||sc<best.sc)best={c,r,sc};}return best;}
function renderCounts(){
 $('counts').innerHTML=OPTIONS.map(o=>{const g=gridFor(o.n,srcAspect);return`<button class="count" data-n="${o.n}" aria-pressed="${o.n===chosen}"><b>${src?g.r*g.c:o.n}</b><small>${o.l}</small></button>`;}).join('');
 const g=gridFor(chosen,srcAspect);
 $('hint').textContent=src?`${g.r} שורות על ${g.c} עמודות`+(chosen>=96&&matchMedia('(max-width:600px)').matches?'. על מסך טלפון החלקים יהיו קטנים, כדאי לנסות קודם 48.':''):'';
}
$('counts').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;chosen=+b.dataset.n;try{localStorage.setItem('puzzle-count',chosen)}catch(e){}renderCounts();};
function setSource(canvas){
 src=canvas;srcAspect=canvas.width/canvas.height;
 $('previewImg').src=canvas.toDataURL('image/jpeg',.85);$('preview').classList.add('on');
 $('startBtn').disabled=false;$('startBtn').textContent='התחל פאזל';$('err').hidden=true;renderCounts();
}
function fromImage(img){const m=1600,k=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;}
$('file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
 const fname=f.name;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=fromImage(img);selectTile(null);setSource(c);saveToCollection(c,fname);};
  img.onerror=()=>{$('err').textContent='לא הצלחתי לפתוח את הקובץ הזה. נסה תמונה בפורמט JPG או PNG.';$('err').hidden=false;};img.src=rd.result;};
 rd.readAsDataURL(f);e.target.value='';};
$('startBtn').onclick=()=>{if(src)startPuzzle(chosen);};

/* ---------- world places (drawn in code) ---------- */
const PW=1500,PH=1000;
function prng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}
function vg(g,y0,y1,stops){const gr=g.createLinearGradient(0,y0,0,y1);stops.forEach(([o,c])=>gr.addColorStop(o,c));return gr;}
function ridge(g,base,amp,freq,col,ph){g.fillStyle=col;g.beginPath();g.moveTo(0,PH);for(let x=0;x<=PW;x+=6)g.lineTo(x,base-Math.abs(Math.sin(x*freq+ph))*amp-Math.sin(x*freq*3.3+ph*2)*amp*.18);g.lineTo(PW,PH);g.closePath();g.fill();}
function starsF(g,r,n,maxY,alpha=.9){for(let i=0;i<n;i++){g.globalAlpha=alpha*(.3+r()*.7);g.fillStyle='#fff';g.beginPath();g.arc(r()*PW,r()*maxY,r()*1.8+.4,0,7);g.fill();}g.globalAlpha=1;}
function ripples(g,r,y0,y1,n,col){g.strokeStyle=col;g.lineCap='round';for(let i=0;i<n;i++){const y=y0+r()*(y1-y0),x=r()*PW,l=15+r()*70*(y-y0)/(y1-y0+1)+10;g.globalAlpha=.2+r()*.45;g.lineWidth=1.5+2*(y-y0)/(y1-y0);g.beginPath();g.moveTo(x,y);g.lineTo(x+l,y);g.stroke();}g.globalAlpha=1;}
function cloud(g,x,y,s,col){g.fillStyle=col;[[0,0,1],[.8,-.25,.8],[1.5,0,.9],[.6,.15,.9],[-.6,.1,.7]].forEach(([dx,dy,k])=>{g.beginPath();g.ellipse(x+dx*60*s,y+dy*60*s,70*s*k,42*s*k,0,0,7);g.fill();});}
function reflect(g,src,yAxis,alpha,tint){g.save();g.globalAlpha=alpha;g.translate(0,yAxis*2);g.scale(1,-1);g.drawImage(src,0,0,PW,yAxis,0,0,PW,yAxis);g.restore();if(tint){g.fillStyle=tint;g.fillRect(0,yAxis,PW,PH-yAxis);}}
function snapshot(c){const k=document.createElement('canvas');k.width=PW;k.height=PH;k.getContext('2d').drawImage(c,0,0);return k;}

const PLACES=[
{name:'פריז',sub:'מגדל אייפל בשקיעה',draw(g,r){
 g.fillStyle=vg(g,0,640,[[0,'#3B2C6B'],[.45,'#C9577E'],[.8,'#F5A25D'],[1,'#FFD58A']]);g.fillRect(0,0,PW,PH);
 g.fillStyle='#FFE7B0';g.beginPath();g.arc(1120,520,80,0,7);g.fill();
 cloud(g,300,200,1.1,'rgba(255,190,170,.45)');cloud(g,1250,150,.9,'rgba(255,200,180,.4)');
 for(let i=0;i<46;i++){const x=i*34+r()*10,h=40+r()*90;g.fillStyle=i%3?'#6E3F5E':'#5B3350';g.fillRect(x,640-h,30+r()*14,h);g.fillStyle='rgba(255,210,140,.75)';for(let k=0;k<5;k++)if(r()<.5)g.fillRect(x+4+r()*20,640-h+8+r()*(h-16),4,6);}
 g.fillStyle=vg(g,640,1000,[[0,'#6C4C84'],[1,'#27305C']]);g.fillRect(0,640,PW,360);
 ripples(g,r,650,1000,220,'#FFC98A');
 const T='#2B1D2A',cx=720,base=820;g.fillStyle=T;g.beginPath();g.moveTo(cx-190,base);g.quadraticCurveTo(cx-60,520,cx-14,120);g.lineTo(cx+14,120);g.quadraticCurveTo(cx+60,520,cx+190,base);g.lineTo(cx+120,base);g.quadraticCurveTo(cx,650,cx-120,base);g.closePath();g.fill();

/* ---------- puzzle build ---------- */
function edgePath(p,x0,y0,x1,y1,d,m){
 if(!d){p.lineTo(x1,y1);return;}
 const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy),nx=dy/len*m*d,ny=-dx/len*m*d;
 const Q=(u,v)=>[x0+dx*u+nx*v,y0+dy*u+ny*v];
 p.lineTo(...Q(.35,0));
 p.bezierCurveTo(...Q(.40,0),...Q(.43,.07),...Q(.38,.13));
 p.bezierCurveTo(...Q(.33,.20),...Q(.41,.27),...Q(.50,.27));
 p.bezierCurveTo(...Q(.59,.27),...Q(.67,.20),...Q(.62,.13));
 p.bezierCurveTo(...Q(.57,.07),...Q(.60,0),...Q(.65,0));
 p.lineTo(x1,y1);
}
function startPuzzle(n){
 const g=gridFor(n,srcAspect),rows=g.r,cols=g.c;
 const bw=srcAspect>=1?1000:1000*srcAspect,bh=srcAspect>=1?1000/srcAspect:1000;
 const pw=bw/cols,ph=bh/rows,m=Math.min(pw,ph),t=m*.3;
 const hv=[],vv=[];for(let r=0;r<rows;r++){hv.push([]);vv.push([]);for(let c=0;c<cols;c++){hv[r].push(Math.random()<.5?1:-1);vv[r].push(Math.random()<.5?1:-1);}}
 const pieces=[];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const top=r?-hv[r-1][c]:0,bot=r<rows-1?hv[r][c]:0,left=c?-vv[r][c-1]:0,right=c<cols-1?vv[r][c]:0;
  const path=new Path2D();path.moveTo(0,0);edgePath(path,0,0,pw,0,top,m);edgePath(path,pw,0,pw,ph,right,m);edgePath(path,pw,ph,0,ph,bot,m);edgePath(path,0,ph,0,0,left,m);path.closePath();
  pieces.push({r,c,hx:c*pw,hy:r*ph,x:0,y:0,g:pieces.length,flash:0,path,sprite:null});
 }
 P={n:rows*cols,rows,cols,bw,bh,pw,ph,m,t,pieces,grid:Array.from({length:rows},(_,r)=>pieces.slice(r*cols,(r+1)*cols)),start:0,elapsed:0,done:false,img:src,chosen:n};
 $('setup').hidden=true;$('hdr').hidden=false;$('done').hidden=true;peek=false;$('peekBtn').setAttribute('aria-pressed','false');
 resize(true);scatter(true);hud();
 clearInterval(timer);timer=setInterval(()=>{if(P&&P.start&&!P.done){hud();}},1000);
}

/* ---------- layout & sprites ---------- */
function world(){ // returns tray rect and world size
 const portrait=W/H<1.15,g=P.m*.35;
 if(portrait){const trayH=Math.min(P.bh*1.6,Math.max(P.bh*.75,P.ph*2.2,(H/W)*P.bw-P.bh-g));return{kind:'p',ww:P.bw,wh:P.bh+g+trayH,tray:{x:0,y:P.bh+g,w:P.bw,h:trayH}};}
 const trayW=Math.min(P.bw*1.6,Math.max(P.bw*.75,P.pw*2.2,(W/H)*P.bh-P.bw-g));return{kind:'l',ww:P.bw+g+trayW,wh:P.bh,tray:{x:P.bw+g,y:0,w:trayW,h:P.bh}};
}
let WL=null;
function resize(force){
 const r=cv.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2.5);
 cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 if(!P)return;
 WL=world();const pad=Math.max(10,Math.min(W,H)*.03);
 s=Math.min((W-pad*2)/(WL.ww+P.t*2),(H-pad*2)/(WL.wh+P.t*2));
 ox=(W-WL.ww*s)/2;oy=(H-WL.wh*s)/2;
 if(WL.kind==='l'){ox=W-(W-WL.ww*s)/2-P.bw*s;} // board on the right side in RTL, tray to its left
 buildSprites();
 if(layoutKind&&layoutKind!==WL.kind&&!force)scatter(false);
 layoutKind=WL.kind;dirty=true;
}
function trayRect(){ // in world coords, accounting for RTL flip in landscape
 if(WL.kind==='l')return{x:-(WL.tray.w+P.m*.35),y:0,w:WL.tray.w,h:WL.tray.h};
 return WL.tray;
}
function buildSprites(){
 const {pw,ph,t}=P,sw=Math.ceil((pw+2*t)*s*dpr),sh=Math.ceil((ph+2*t)*s*dpr),k=s*dpr;
 P.pieces.forEach(pc=>{
  const c=pc.sprite&&pc.sprite.width===sw&&pc.sprite.height===sh?pc.sprite:document.createElement('canvas');c.width=sw;c.height=sh;
  const g=c.getContext('2d');g.setTransform(k,0,0,k,0,0);g.clearRect(0,0,sw,sh);g.translate(t,t);
  g.save();g.clip(pc.path);g.drawImage(P.img,0,0,P.img.width,P.img.height,-pc.hx,-pc.hy,P.bw,P.bh);
  g.lineWidth=2.4/s;g.strokeStyle='rgba(255,255,255,.35)';g.translate(.8/s,.8/s);g.stroke(pc.path);g.restore();
  g.lineWidth=1.2/s;g.strokeStyle='rgba(0,0,0,.45)';g.stroke(pc.path);
  pc.sprite=c;});
}
function groupOf(p){return P.pieces.filter(q=>q.g===p.g);}
function onBoard(p){const cx=p.x+P.pw/2,cy=p.y+P.ph/2;return cx>0&&cx<P.bw&&cy>0&&cy<P.bh;}
function moveGroup(gr,dx,dy){gr.forEach(q=>{q.x+=dx;q.y+=dy;});}
function scatter(all){
 const tr=trayRect(),seen=new Set();
 shuffleArr([...P.pieces]).forEach(p=>{if(seen.has(p.g))return;seen.add(p.g);const gr=groupOf(p);if(!all&&gr.some(onBoard))return;
  const minx=Math.min(...gr.map(q=>q.x)),miny=Math.min(...gr.map(q=>q.y)),gw=Math.max(...gr.map(q=>q.x))+P.pw-minx,gh=Math.max(...gr.map(q=>q.y))+P.ph-miny;
  moveGroup(gr,tr.x+Math.random()*Math.max(1,tr.w-gw)-minx,tr.y+Math.random()*Math.max(1,tr.h-gh)-miny);});
 dirty=true;hud();
}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const FLASH=700;
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 if(!P)return;
 const bx=ox,by=oy,bw=P.bw*s,bh=P.bh*s;

 if(P.done||peek){ctx.globalAlpha=P.done?1:.45;ctx.drawImage(P.img,bx,by,bw,bh);ctx.globalAlpha=1;}
 if(P.done)return;

 ctx.beginPath();for(let c=1;c<P.cols;c++){const x=Math.round(bx+c*P.pw*s)+.5;ctx.moveTo(x,by);ctx.lineTo(x,by+bh);}for(let r=1;r<P.rows;r++){const y=Math.round(by+r*P.ph*s)+.5;ctx.moveTo(bx,y);ctx.lineTo(bx+bw,y);}ctx.stroke();

 const tr=trayRect();ctx.setLineDash([6,6]);ctx.strokeRect(ox+tr.x*s,oy+tr.y*s,tr.w*s,tr.h*s);ctx.setLineDash([]);
 const t=P.t,sw=(P.pw+2*t)*s,sh=(P.ph+2*t)*s,now=performance.now(),dg=drag?drag.p.g:null;
 P.pieces.forEach(p=>{
  const x=ox+(p.x-t)*s,y=oy+(p.y-t)*s;
  if(p.g===dg){ctx.save();ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=10;ctx.shadowOffsetY=5;ctx.drawImage(p.sprite,x,y,sw,sh);ctx.restore();}
  else ctx.drawImage(p.sprite,x,y,sw,sh);
 });

  ctx.save();ctx.translate(ox+p.x*s,oy+p.y*s);ctx.scale(s,s);

   if(!P.start)P.start=performance.now();dirty=true;e.preventDefault();return;}}
});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const w=toWorld(e),p=drag.p;
 const minX=(-ox)/s-P.pw*.5,maxX=(W-ox)/s-P.pw*.5,minY=(-oy)/s-P.ph*.5,maxY=(H-oy)/s-P.ph*.5;
 const nx=Math.max(minX,Math.min(maxX,w.x-drag.dx)),ny=Math.max(minY,Math.min(maxY,w.y-drag.dy));
 moveGroup(groupOf(p),nx-p.x,ny-p.y);dirty=true;});
function drop(e){
 if(!drag||e.pointerId!==drag.id)return;const p=drag.p;drag=null;let gr=groupOf(p);
 // 1) grid snap when the grabbed piece lands on the board (no check of correctness)
 const cx=p.x+P.pw/2,cy=p.y+P.ph/2;let snapped=false;
 if(cx>0&&cx<P.bw&&cy>0&&cy<P.bh){
  const cs=gr.map(q=>q.c),rs=gr.map(q=>q.r);
  let dc=Math.round(p.x/P.pw)-p.c,dr=Math.round(p.y/P.ph)-p.r;
  dc=Math.max(-Math.min(...cs),Math.min(P.cols-1-Math.max(...cs),dc));
  dr=Math.max(-Math.min(...rs),Math.min(P.rows-1-Math.max(...rs),dr));
  gr.forEach(q=>{q.x=(q.c+dc)*P.pw;q.y=(q.r+dr)*P.ph;});snapped=true;
 }
 // 2) join matching neighbours (same relative offset as in the picture)
 const joined=[];
 for(let guard=0;guard<P.n;guard++){let found=false;
  outer:for(const q of gr){for(const[r2,c2]of[[0,1],[0,-1],[1,0],[-1,0]]){
   const row=P.grid[q.r+r2],nb=row&&row[q.c+c2];if(!nb||nb.g===q.g)continue;
   const ex=(nb.x-nb.hx)-(q.x-q.hx),ey=(nb.y-nb.hy)-(q.y-q.hy);
   if(Math.hypot(ex,ey)<P.m*.25){const other=groupOf(nb);moveGroup(gr,ex,ey);other.forEach(o=>o.g=q.g);joined.push(...other);gr=groupOf(q);found=true;break outer;}}}
  if(!found)break;}
 if(joined.length){const now=performance.now();gr.forEach(q=>q.flash=now);sndJoin();}
 else if(snapped)sndSnap();
 P.pieces=[...P.pieces.filter(q=>q.g!==p.g),...gr];
 if(P.pieces.every(q=>Math.abs(q.x-q.hx)<.5&&Math.abs(q.y-q.hy)<.5))finish();
 hud();dirty=true;}
cv.addEventListener('pointerup',drop);cv.addEventListener('pointercancel',drop);
document.addEventListener('touchmove',e=>{if(e.target===cv)e.preventDefault();},{passive:false});

function fmt(ms){const sec=Math.floor(ms/1000);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function elapsed(){return P.done?P.elapsed:P.start?performance.now()-P.start:0;}
function hud(){if(!P)return;$('prog').textContent=`${P.pieces.filter(onBoard).length}/${P.n}`;$('time').textContent=fmt(elapsed());}
function finish(){P.elapsed=performance.now()-P.start;P.done=true;hud();dirty=true;sndWin();
 $('doneText').textContent=`${P.n} חלקים ב-${fmt(P.elapsed)} דקות.`;
 const next=OPTIONS.find(o=>o.n>P.chosen);$('moreBtn').hidden=!next;if(next)$('moreBtn').textContent=`אותה תמונה, ${next.n} חלקים`;
 $('done').hidden=false;}
$('moreBtn').onclick=()=>{const next=OPTIONS.find(o=>o.n>P.chosen);if(next){chosen=next.n;startPuzzle(next.n);}};
$('againBtn').onclick=()=>toSetup();
$('newBtn').onclick=()=>{if(!P||P.done||!P.start||confirm('לעזוב את הפאזל הנוכחי?'))toSetup();};
$('scatterBtn').onclick=()=>{if(P&&!P.done)scatter(false);};
$('peekBtn').onclick=()=>{peek=!peek;$('peekBtn').setAttribute('aria-pressed',String(peek));dirty=true;};
function toSetup(){P=null;clearInterval(timer);$('hdr').hidden=true;$('done').hidden=true;$('setup').hidden=false;renderCounts();dirty=true;}

addEventListener('resize',()=>{resize(false);});
renderCounts();resize(true);requestAnimationFrame(loop);
})();
</script>
</body>
