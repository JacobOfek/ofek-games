<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="/boom/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/boom-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boom Boom Boom">

</head><body>
<title>Boom Boom Boom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen arcade table — two 3x3 boards (stacked on phone, side by side when wide), status bar on top, opaque hand-off screens between secret steps */
:root{
  --bg:#e9edf3; --surface:#ffffff; --ink:#1a2130; --muted:#5b6476; --line:#cfd6e2;
  --p1:#e0503b; --p2:#2378b5; --fuse:#f0a92a; --safe:#2c9a66; --shade:rgba(20,26,38,.55);
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131923; --surface:#1d2531; --ink:#edf1f7; --muted:#99a3b5; --line:#2e3949;
  --p1:#ff6a52; --p2:#4aa2e0; --fuse:#ffbe45; --safe:#45c38a; --shade:rgba(5,8,14,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131923; --surface:#1d2531; --ink:#edf1f7; --muted:#99a3b5; --line:#2e3949;
  --p1:#ff6a52; --p2:#4aa2e0; --fuse:#ffbe45; --safe:#45c38a; --shade:rgba(5,8,14,.7); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden;
  -webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box}
button{font-family:var(--body);font-weight:700;font-size:16px;border:0;border-radius:12px;
  padding:12px 20px;cursor:pointer;color:#fff;background:var(--ink);min-height:44px}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--fuse);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}

header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--display);font-size:clamp(18px,4.6vw,26px);letter-spacing:.02em;line-height:1;white-space:nowrap}
.logo b{color:var(--p1);font-weight:400}.logo i{color:var(--p2);font-style:normal}
.hbtns{display:flex;gap:8px;align-items:center}
.score{display:flex;gap:6px;font-variant-numeric:tabular-nums;font-weight:700}
.score span{padding:5px 10px;border-radius:999px;color:#fff;font-size:14px}
.iconbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:8px 12px;min-height:40px;font-size:14px}

#status{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  min-height:52px;text-align:center;font-size:17px;font-weight:500}
#status .who{font-weight:700}
#statusText{min-width:0}

#boards{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  --bsz:min(calc(100vw - 40px),calc((100vh - 230px)/2),420px)}
@supports (height:100dvh){#boards{--bsz:min(calc(100vw - 40px),calc((100dvh - 230px)/2),420px)}}
@media (min-aspect-ratio:1/1){
  #boards{flex-direction:row;gap:clamp(16px,4vw,56px);--bsz:min(calc((100vw - 90px)/2),calc(100vh - 190px),460px)}
  @supports (height:100dvh){#boards{--bsz:min(calc((100vw - 90px)/2),calc(100dvh - 190px),460px)}}
}
.board{width:var(--bsz);display:flex;flex-direction:column;gap:6px;transition:opacity .25s,transform .25s}
.board.dim{opacity:.38}
.board.active .grid{box-shadow:0 0 0 3px var(--pc),0 10px 30px -12px var(--pc)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.bname{font-weight:700;color:var(--pc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bsafe{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--bsz)*.03);padding:calc(var(--bsz)*.03);
  background:var(--surface);border-radius:16px;aspect-ratio:1;box-sizing:border-box;max-width:100%;transition:box-shadow .25s}
.card{position:relative;border-radius:10px;border:0;padding:0;min-height:0;cursor:pointer;
  background:var(--pc);color:#fff;font-family:var(--display);font-size:calc(var(--bsz)*.07);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 6px,transparent 6px 14px);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);display:grid;place-items:center;transition:transform .12s}
.card .n{position:absolute;top:6%;left:9%;font-size:.55em;opacity:.75}
.card .mark{width:58%;height:58%;display:grid;place-items:center}
.card .mark svg{width:100%;height:100%}
.board.active .card:not(.open):hover{transform:translateY(-2px)}
.card:active{transform:scale(.96)}
.card.open{background:var(--bg);background-image:none;box-shadow:inset 0 0 0 2px var(--line);cursor:default;animation:flip .35s ease-out}
.card.safe .mark{color:var(--safe)}
.card.boom{background:var(--fuse);animation:flip .35s ease-out,pulse .6s .35s 2}
.card.boom .mark{color:#1a2130}
.card.planted{background:#1a2130;background-image:none;box-shadow:inset 0 0 0 3px var(--fuse)}
.card.planted .mark{color:var(--fuse)}
.card.ghost{background:var(--bg);background-image:none;box-shadow:inset 0 0 0 2px dashed var(--line);cursor:default}
.card.ghost .mark{color:var(--muted);opacity:.7}
.card .cnt{position:absolute;bottom:5%;right:7%;font-family:var(--display);font-size:.6em;background:var(--ink);color:var(--bg);border-radius:999px;padding:.1em .45em;line-height:1.2}
.board.shake{animation:shake .5s}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),var(--fuse) 0,rgba(240,169,42,.4) 25%,transparent 60%)}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

#screen{position:fixed;inset:0;display:grid;place-items:center;z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
#screen.opaque{background:var(--bg)}
#screen.veil{background:var(--shade)}
.panel{width:min(440px,100%);background:var(--surface);border-radius:20px;padding:26px 22px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);max-height:100%;overflow:auto}
.panel h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.panel h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,30px);line-height:1.1;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted);line-height:1.5}
.panel .big{font-size:17px;color:var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.names{display:grid;gap:10px}
.names label{display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;font-size:14px}
.names .dot{width:14px;height:14px;border-radius:50%;flex:none}
.names input{flex:1;min-width:0;font:500 17px var(--body);padding:11px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
.rules{text-align:left;display:grid;gap:6px;font-size:14px;color:var(--muted);padding:12px 14px;background:var(--bg);border-radius:12px;line-height:1.45}
.rules strong{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row button{flex:1 1 140px}
.bigicon{width:76px;height:76px;margin:0 auto;color:var(--fuse)}
.final{font-family:var(--display);font-size:34px;display:flex;justify-content:center;gap:18px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header>
    <div class="logo"><b>BOOM</b> <i>BOOM</i> BOOM</div>
    <div class="hbtns">
      <div class="score" id="score"></div>
      <button class="iconbtn" id="soundBtn" aria-label="Toggle sound">Sound on</button>
      <button class="iconbtn" id="menuBtn">New</button>
    </div>
  </header>
  <div id="status"><span id="statusText"></span><button id="clearBtn" class="ghost" hidden>Clear bombs</button><button id="confirmBtn" hidden>Confirm bombs</button></div>
  <div id="boards"><div class="board" id="b0"></div><div class="board" id="b1"></div></div>
</div>
<div id="flash"></div>
<div id="screen"></div>

<script>
const BOMB='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="28" cy="38" r="20" fill="currentColor"/><rect x="33" y="13" width="10" height="9" rx="2" transform="rotate(35 38 17)" fill="currentColor"/><path d="M42 12 q6 -8 12 -4" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="55" cy="7" r="4" fill="#f0a92a"/><circle cx="21" cy="31" r="5" fill="#fff" opacity=".35"/></svg>';
const SAFE='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="5"/><path d="M19 33 l9 9 l18 -19" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const COLORS=['var(--p1)','var(--p2)'];
const $=id=>document.getElementById(id);
const tot=b=>S.bombs[b].reduce((a,c)=>a+c,0);
const hits=b=>[...S.rev[b]].reduce((a,i)=>a+S.bombs[b][i],0);

const S={names:['Player 1','Player 2'],scores:[0,0],bombs:[Array(9).fill(0),Array(9).fill(0)],rev:[new Set(),new Set()],
  phase:'start',planter:0,turn:0,starter:null,lock:false,loser:null,muted:false};
try{const d=JSON.parse(localStorage.getItem('bbb')||'{}');if(d.names)S.names=d.names;if(d.scores)S.scores=d.scores;if(d.muted)S.muted=true}catch(e){}
function save(){try{localStorage.setItem('bbb',JSON.stringify({names:S.names,scores:S.scores,muted:S.muted}))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=i=>`<span class="who" style="color:${COLORS[i]}">${esc(S.names[i])}</span>`;

/* ---------- sound ---------- */
let ac=null;
function actx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tick(){if(S.muted)return;const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(880,a.currentTime);o.frequency.exponentialRampToValueAtTime(1320,a.currentTime+.08);g.gain.setValueAtTime(.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.16)}
function boom(){if(S.muted)return;const a=actx();if(!a)return;const len=a.sampleRate*1.2,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(1800,a.currentTime);f.frequency.exponentialRampToValueAtTime(80,a.currentTime+1);const g=a.createGain();g.gain.value=.9;s.connect(f).connect(g).connect(a.destination);s.start();
  const o=a.createOscillator(),og=a.createGain();o.frequency.setValueAtTime(120,a.currentTime);o.frequency.exponentialRampToValueAtTime(35,a.currentTime+.5);og.gain.setValueAtTime(.7,a.currentTime);og.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.connect(og).connect(a.destination);o.start();o.stop(a.currentTime+.6)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- render ---------- */
function renderHeader(){
  $('score').innerHTML=S.scores.map((v,i)=>`<span style="background:${COLORS[i]}" title="${esc(S.names[i])}">${v}</span>`).join('');
  $('soundBtn').textContent=S.muted?'Sound off':'Sound on';
}
function render(){
  renderHeader();
  for(let b=0;b<2;b++){
    const el=$('b'+b);el.style.setProperty('--pc',COLORS[b]);
    const found=hits(b);
    let act=false,dim=false;
    if(S.phase==='plant'){act=b!==S.planter;dim=!act}
    if(S.phase==='play'){act=b===S.turn;dim=!act}
    el.className='board'+(act?' active':'')+(dim?' dim':'');
    let h=`<div class="bhead"><span class="bname">${esc(S.names[b])}'s cards</span><span class="bsafe">${S.phase==='plant'?'':'Bombs hit: '+found+'/3'}</span></div><div class="grid">`;
    for(let i=0;i<9;i++){
      const k=S.bombs[b][i],isB=k>0,open=S.rev[b].has(i);
      let cls='card',mark='';
      if(open){cls+=' open '+(isB?'boom':'safe');mark=isB?BOMB:SAFE}
      else if(S.phase==='plant'&&b!==S.planter&&isB){cls+=' planted';mark=BOMB}
      else if(S.phase==='over'&&isB){cls+=' ghost';mark=BOMB}
      h+=`<button class="${cls}" data-b="${b}" data-i="${i}" aria-label="${esc(S.names[b])} card ${i+1}"><span class="n">${i+1}</span><span class="mark">${mark}</span>${mark&&k>1?`<span class="cnt">×${k}</span>`:''}</button>`;
    }
    el.innerHTML=h+'</div>';
  }
  const cb=$('confirmBtn'),st=$('statusText');
  cb.hidden=S.phase!=='plant';$('clearBtn').hidden=S.phase!=='plant';$('clearBtn').disabled=S.phase==='plant'&&tot(1-S.planter)===0;
  if(S.phase==='plant'){
    const t=1-S.planter,n=tot(t);
    st.innerHTML=`${nm(S.planter)}: hide 3 bombs in ${nm(t)}'s cards <b>(${n}/3)</b>`;
    cb.disabled=n!==3;cb.style.background=COLORS[S.planter];
  }else if(S.phase==='play'){
    st.innerHTML=`${nm(S.turn)}'s turn. Flip one of your cards.`;
  }else if(S.phase==='over'){
    st.innerHTML=`${nm(S.loser)} hit all 3 bombs. ${nm(1-S.loser)} wins!`;
  }else st.textContent='';
}

/* ---------- screens ---------- */
function screen(html,mode){const s=$('screen');s.className=mode||'opaque';s.innerHTML=html;s.hidden=!html}
function showStart(){
  S.phase='start';render();
  screen(`<div class="panel">
    <div class="eyebrow">2 players · 1 device</div>
    <h1><span style="color:var(--p1)">BOOM</span> <span style="color:var(--p2)">BOOM</span> BOOM</h1>
    <div class="names">
      <label><span class="dot" style="background:var(--p1)"></span><input id="n0" maxlength="14" value="${esc(S.names[0])}" aria-label="Player 1 name"></label>
      <label><span class="dot" style="background:var(--p2)"></span><input id="n1" maxlength="14" value="${esc(S.names[1])}" aria-label="Player 2 name"></label>
    </div>
    <div class="rules">
      <div><strong>Setup.</strong> Each player secretly hides 3 bombs among the other player's 9 cards. One card can hold more than one bomb.</div>
      <div><strong>Play.</strong> Take turns flipping one of your own cards.</div>
      <div><strong>Lose.</strong> The first player to flip all 3 of their bombs loses.</div>
    </div>
    <button id="go" style="background:var(--p1)">Start game</button>
  </div>`);
  $('go').onclick=()=>{actx();
    const a=$('n0').value.trim()||'Player 1',b=$('n1').value.trim()||'Player 2';
    if(a!==S.names[0]||b!==S.names[1])S.scores=[0,0];
    S.names=[a,b];save();newRound(true)};
}
function newRound(fresh){
  S.bombs=[Array(9).fill(0),Array(9).fill(0)];S.rev=[new Set(),new Set()];S.loser=null;S.lock=false;
  S.starter=(fresh||S.starter===null)?(Math.random()<.5?0:1):1-S.starter;
  S.planter=S.starter;handoffPlant();
}
function handoffPlant(){
  S.phase='hand';render();const p=S.planter,o=1-p;
  screen(`<div class="panel">
    <div class="eyebrow">Secret step ${tot(o)===0&&tot(p)===0?'1':'2'} of 2</div>
    <h2>Pass the device to <span style="color:${COLORS[p]}">${esc(S.names[p])}</span></h2>
    <p class="big">${esc(S.names[o])}, look away!</p>
    <p>${esc(S.names[p])} will hide 3 bombs (several can share a card) among ${esc(S.names[o])}'s cards.</p>
    <button id="go" style="background:${COLORS[p]}">I'm ${esc(S.names[p])}, show me</button>
  </div>`);
  $('go').onclick=()=>{actx();screen('');S.phase='plant';render()};
}
function handoffPlay(){
  S.phase='hand';render();
  screen(`<div class="panel">
    <div class="bigicon">${BOMB}</div>
    <h2>All bombs are hidden</h2>
    <p class="big">Put the device between you.<br>${nm(S.starter)} goes first.</p>
    <button id="go" style="background:${COLORS[S.starter]}">Start flipping</button>
  </div>`);
  $('go').onclick=()=>{screen('');S.turn=S.starter;S.phase='play';render()};
}
function showOver(){
  const w=1-S.loser;
  screen(`<div class="panel">
    <div class="eyebrow">Round over</div>
    <h2><span style="color:${COLORS[w]}">${esc(S.names[w])}</span> wins!</h2>
    <p class="big">${esc(S.names[S.loser])} flipped all 3 bombs.</p>
    <div class="final"><span style="color:var(--p1)">${S.scores[0]}</span><span style="color:var(--muted)">:</span><span style="color:var(--p2)">${S.scores[1]}</span></div>
    <div class="row"><button id="again" style="background:${COLORS[1-S.starter]}">Play again</button><button class="ghost" id="look">See the boards</button></div>
    <button class="ghost" id="newp">New players</button>
  </div>`,'veil');
  $('again').onclick=()=>{screen('');newRound(false)};
  $('look').onclick=()=>{screen('');$('statusText').insertAdjacentHTML('beforeend',' <button id="again2" style="background:var(--ink);margin-left:6px">Play again</button>');$('again2').onclick=()=>newRound(false)};
  $('newp').onclick=showStart;
}

/* ---------- input ---------- */
$('boards').addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c)return;
  const b=+c.dataset.b,i=+c.dataset.i;
  if(S.phase==='plant'){
    if(b===S.planter)return;
    if(tot(b)<3){S.bombs[b][i]++;tick();buzz(15)}
    render();return;
  }
  if(S.phase!=='play'||S.lock||b!==S.turn||S.rev[b].has(i))return;
  S.lock=true;S.rev[b].add(i);
  if(S.bombs[b][i]>0){
    const r=c.getBoundingClientRect();const f=$('flash');
    f.style.setProperty('--fx',(r.left+r.width/2)+'px');f.style.setProperty('--fy',(r.top+r.height/2)+'px');
    render();boom();buzz([60,40,120]);
    f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
    $('b'+b).classList.add('shake');
    if(hits(b)>=3){
      S.loser=b;S.scores[1-b]++;save();
      setTimeout(()=>{S.phase='over';render();setTimeout(showOver,900)},700);
    }else{
      setTimeout(()=>{S.turn=1-S.turn;S.lock=false;render()},900);
    }
  }else{
    render();tick();
    setTimeout(()=>{S.turn=1-S.turn;S.lock=false;render()},500);
  }
});
$('confirmBtn').onclick=()=>{
  if(tot(1-S.planter)!==3)return;
  const other=1-S.planter;
  if(tot(S.planter)===3){handoffPlay()}
  else{S.planter=other;handoffPlant()}
};
$('clearBtn').onclick=()=>{S.bombs[1-S.planter]=Array(9).fill(0);render()};
$('soundBtn').onclick=()=>{S.muted=!S.muted;save();renderHeader();if(!S.muted)tick()};
$('menuBtn').onclick=()=>{
  screen(`<div class="panel"><h2>Start over?</h2><p>The current round will be lost.</p>
    <div class="row"><button id="y" style="background:var(--p1)">New game</button><button class="ghost" id="n">Keep playing</button></div>
    <button class="ghost" id="rs">Reset score</button></div>`,'veil');
  $('y').onclick=showStart;
  $('n').onclick=()=>{screen('');if(S.phase==='start')showStart();else if(S.phase==='hand'){tot(0)+tot(1)===6?handoffPlay():handoffPlant()}else if(S.phase==='over')showOver()};
  $('rs').onclick=()=>{S.scores=[0,0];save();renderHeader();$('n').click()};
};
showStart();
</script>
